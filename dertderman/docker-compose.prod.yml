name: dertderman-prod

services:

  db:
    image: postgres:16.15-alpine3.24@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password

    secrets:
      - postgres_admin_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  db-bootstrap:
    build:
      context: .

    restart: "no"

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:?POSTGRES_MIGRATOR_USER is required}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}

      POSTGRES_ADMIN_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_MIGRATOR_PASSWORD_FILE: /run/secrets/postgres_migrator_password
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/postgres_app_password

    secrets:
      - postgres_admin_password
      - postgres_migrator_password
      - postgres_app_password

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend

    command:
      [
        "python",
        "/app/deploy/postgres/bootstrap_roles.py"
      ]


  redis:
    image: redis:7.4.11-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    volumes:
      - redis_data:/data

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 3s
      retries: 10


  migrate:
    build:
      context: .

    restart: "no"

    env_file:
      - .env.production

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_MIGRATOR_USER:?POSTGRES_MIGRATOR_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_migrator_password

      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key

      REDIS_URL: redis://redis:6379/0

    secrets:
      - django_secret_key
      - postgres_migrator_password

    depends_on:
      db-bootstrap:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

    volumes:
      - static_data:/var/lib/dertderman/static

    networks:
      - backend

    command:
      [
        "sh",
        "-c",
        "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
      ]


  web:
    build:
      context: .

    restart: unless-stopped

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    env_file:
      - .env.production

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_app_password

      DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key

      REDIS_URL: redis://redis:6379/0

    secrets:
      - django_secret_key
      - postgres_app_password

    depends_on:
      migrate:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

    volumes:
      - static_data:/var/lib/dertderman/static:ro
      - media_data:/var/lib/dertderman/media

    networks:
      - frontend
      - backend

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health/live/', headers={'Host':'dertderman.com','X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=3)"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s


  nginx:
    image: nginx:1.30.5-alpine3.24-slim@sha256:0ae85631d55f78b0ad8e8468baadd7fa82c1a1285152c63055fd6333dded4e06
    restart: unless-stopped

    depends_on:
      web:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ${NGINX_CONFIG_FILE:-./deploy/nginx/bootstrap.conf}:/etc/nginx/conf.d/default.conf:ro

      - static_data:/var/lib/dertderman/static:ro
      - media_data:/var/lib/dertderman/media:ro

      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro

    networks:
      - frontend


  db-tools:
    image: postgres:16.15-alpine3.24@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb

    profiles:
      - tools

    volumes:
      - ./deploy/postgres/db-tools-entrypoint.sh:/usr/local/bin/db-tools-entrypoint.sh:ro

    entrypoint:
      - /bin/sh
      - /usr/local/bin/db-tools-entrypoint.sh

    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_MIGRATOR_USER:?POSTGRES_MIGRATOR_USER is required}

      POSTGRES_MIGRATOR_PASSWORD_FILE: /run/secrets/postgres_migrator_password

    secrets:
      - postgres_migrator_password

    depends_on:
      db-bootstrap:
        condition: service_completed_successfully

    networks:
      - backend


  certbot:
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20

    profiles:
      - tools

    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

    networks:
      - frontend


secrets:

  django_secret_key:
    file: ./secrets/django_secret_key.txt

  postgres_admin_password:
    file: ./secrets/postgres_admin_password.txt

  postgres_migrator_password:
    file: ./secrets/postgres_migrator_password.txt

  postgres_app_password:
    file: ./secrets/postgres_app_password.txt


networks:

  frontend:

  backend:
    internal: true


volumes:

  postgres_data:

  redis_data:

  static_data:

  media_data:

  letsencrypt:

  certbot_webroot:
