server_tokens off;

upstream dertderman_web {
    server web:8000;
}

log_format safe_access
    '$remote_addr [$time_local] '
    '"$request_method $uri $server_protocol" '
    '$status $body_bytes_sent';

access_log /var/log/nginx/access.log safe_access;


server {
    listen 80;
    listen [::]:80;

    server_name dertderman.com www.dertderman.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;

        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    server_name dertderman.com www.dertderman.com;

    ssl_certificate
        /etc/letsencrypt/live/dertderman.com/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/dertderman.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header X-Content-Type-Options
        "nosniff"
        always;

    add_header Referrer-Policy
        "same-origin"
        always;

    add_header X-Frame-Options
        "DENY"
        always;

    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=()"
        always;

    location /static/ {
        alias /var/lib/dertderman/static/;

        access_log off;

        expires 7d;
    }

    location ^~ /media/companies/logos/ {
        alias /var/lib/dertderman/media/companies/logos/;

        access_log off;

        expires 1h;
    }

    location ^~ /media/blog/covers/ {
        alias /var/lib/dertderman/media/blog/covers/;

        access_log off;

        expires 1h;
    }

    location ^~ /media/ {
        access_log off;

        return 404;
    }

    location / {
        proxy_pass http://dertderman_web;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        client_max_body_size 6m;
    }
}
