{% load static %}
<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f9ff" />
    <noscript>
      <meta http-equiv="refresh" content="3.5;url={% url 'core:home' %}" />
    </noscript>
    <title>DertDerman'a Hoş Geldiniz</title>
    <link rel="stylesheet" href="{% static 'css/intro.css' %}?v=12" />
  </head>
  <body

    data-home-url="{% url 'core:home' %}"
    data-preview="{% if intro_preview %}true{% else %}false{% endif %}"
    data-full-motion="{{ intro_full_motion|yesno:'true,false' }}"

    <main class="intro-stage" aria-label="DertDerman açılışı">

        <path d="M-80 590C180 410 310 690 575 510S965 250 1280 390" />
        <path d="M-40 645C235 465 365 740 640 555S1015 330 1240 445" />
      </svg>

      <div class="intro-falling" aria-hidden="true">
        <svg class="intro-symbol-defs" width="0" height="0" focusable="false">
          <defs>

            <symbol id="intro-icon-building" viewBox="0 0 24 24"><path d="M5 21V4l14-2v19M3 21h18M10 21v-5h4v5M9 7h1m4 0h1M9 11h1m4 0h1"/></symbol>

            <symbol id="intro-icon-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 8.5a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4M12 16h.01"/></symbol>
            <symbol id="intro-icon-headset" viewBox="0 0 24 24"><path d="M4 13V11a8 8 0 0 1 16 0v6a4 4 0 0 1-4 4h-4"/><rect x="3" y="11" width="4" height="7" rx="2"/><rect x="17" y="11" width="4" height="7" rx="2"/></symbol>
            <symbol id="intro-icon-person" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2M8 21h8"/></symbol>

            <symbol id="intro-icon-megaphone" viewBox="0 0 24 24"><path d="m4 9 16-5v16L4 15ZM4 9H2v6h2M7 16l2 5h4l-2-4M20 9h2v6h-2"/></symbol>

            <symbol id="intro-icon-settings" viewBox="0 0 24 24"><path d="m10 2-.5 3-2 .9L5 4.5 2.5 9l2.3 1.6v2.8L2.5 15 5 19.5l2.5-1.4 2 .9.5 3h4l.5-3 2-.9 2.5 1.4 2.5-4.5-2.3-1.6v-2.8L21.5 9 19 4.5l-2.5 1.4-2-.9L14 2Z"/><circle cx="12" cy="12" r="3"/></symbol>

            <svg class="intro-symbol intro-symbol--phone" viewBox="0 0 24 24" focusable="false"><use href="#intro-icon-phone"/></svg>

          </span>

          <span class="intro-particle">

          </span>

          </span>

      <div class="intro-composition">
        <p class="intro-welcome">DertDerman'a Hoş Geldiniz</p>

        <div class="intro-orbit">
          <svg class="intro-ring-svg" viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <linearGradient id="intro-ring-gradient" x1="10" y1="8" x2="90" y2="92" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#102a43" />
                <stop offset=".25" stop-color="#1d5fa7" />
                <stop offset=".5" stop-color="#38b9cf" />
                <stop offset=".72" stop-color="#b8e4f2" />
                <stop offset=".88" stop-color="#7e75c7" />
                <stop offset="1" stop-color="#287fc1" />
              </linearGradient>
              <filter id="intro-soft-glow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="1.15" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <circle class="intro-ring__track" cx="50" cy="50" r="45" />
            <g class="intro-ring__rotor">
              <circle class="intro-ring__color" cx="50" cy="50" r="45" />
              <circle class="intro-ring__arc" cx="50" cy="50" r="48" />
            </g>
          </svg>

          <svg class="intro-decor intro-decor--orbit" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="3.5" r="1.15" />
            <circle cx="50" cy="96.5" r="0.7" />
          </svg>

          <svg class="intro-decor intro-decor--sparkle" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.5c.7 5.1 2.8 7.2 7.9 7.9-5.1.7-7.2 2.8-7.9 7.9-.7-5.1-2.8-7.2-7.9-7.9C9.2 9.7 11.3 7.6 12 2.5Z" />
            <circle cx="19.3" cy="4.7" r="1.2" />
          </svg>

          <svg class="intro-decor intro-decor--nodes" viewBox="0 0 90 48" aria-hidden="true">
            <path d="M8 35 34 14l24 18 24-22" />
            <circle cx="8" cy="35" r="3" />
            <circle cx="34" cy="14" r="3" />
            <circle cx="58" cy="32" r="3" />
            <circle cx="82" cy="10" r="3" />
          </svg>

          <svg class="intro-decor intro-decor--bubble" viewBox="0 0 56 52" aria-hidden="true">
            <path d="M11 8h31a7 7 0 0 1 7 7v17a7 7 0 0 1-7 7H26L15 47l2-8h-6a7 7 0 0 1-7-7V15a7 7 0 0 1 7-7Z" />
            <circle cx="20" cy="24" r="2" />
            <circle cx="28" cy="24" r="2" />
            <circle cx="36" cy="24" r="2" />
          </svg>

          <h1 class="intro-wordmark" aria-label="Dert Derman">
            <span class="intro-wordmark__dert">DERT</span>
            <span class="intro-wordmark__derman">DERMAN</span>
          </h1>
        </div>
      </div>

      <noscript>
        <style>
          .intro-welcome, .intro-ring-svg, .intro-wordmark { opacity: 1; }
        </style>
        <a href="{% url 'core:home' %}">Ana sayfaya geç</a>
      </noscript>
    </main>
    <script>
      (() => {
        "use strict";

        const INTRO_DURATION = 3500;
        const REDUCED_MOTION_DURATION = 250;
        const fullMotion = document.body.dataset.fullMotion === "true";
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
        const duration = fullMotion || !reducedMotion.matches
          ? INTRO_DURATION
          : REDUCED_MOTION_DURATION;

        // Start the visual timeline and its only redirect timer together,
        // after the stylesheet and intro markup are ready for painting.
        window.requestAnimationFrame(() => {
          document.body.dataset.introStarted = "true";
          window.setTimeout(() => {
            try {
              sessionStorage.setItem("dd_intro_returning", "1");
            } catch (_) { /* Same-origin referrer also prevents a return loop. */ }
            window.location.replace("/");
          }, duration);
        });
      })();
    </script>
  </body>
</html>
