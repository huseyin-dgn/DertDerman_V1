{% load static %}{% get_static_prefix as static_prefix %}<fieldset class="company-avatar-presets"><legend>{{ field.label }}</legend>{{ field.errors }}<div>{% for choice in field %}<label class="company-avatar-option">{{ choice.tag }}<span class="company-avatar-choice">{% if choice.data.value %}<img src="{{ static_prefix }}images/avatars/companies/{{ choice.data.value }}.svg" alt="" loading="lazy" decoding="async">{% else %}<b>{{ company.name|first|upper }}</b>{% endif %}</span><small>{{ choice.choice_label }}</small><span class="avatar-choice-check" aria-hidden="true">✓</span></label>{% endfor %}</div><small>Logo yüklenmemişse seçtiğiniz kurumsal simge gösterilir.</small></fieldset>
