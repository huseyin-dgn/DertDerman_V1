{% load static %}{% get_static_prefix as static_prefix %}{% if company.logo %}<img class="{{ image_class|default:'company-logo' }}" src="{{ company.logo.url }}" alt="{{ company.name }} logosu" loading="lazy" decoding="async">{% elif company.selected_avatar %}<img class="{{ image_class|default:'company-logo' }} company-built-in-avatar" src="{{ static_prefix }}images/avatars/companies/{{ company.selected_avatar }}.svg" alt="" loading="lazy" decoding="async">{% else %}<span class="{{ fallback_class|default:'company-avatar' }}" aria-hidden="true">{{ company.name|first|upper }}</span>{% endif %}
