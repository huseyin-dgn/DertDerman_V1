{% load static %}{% get_static_prefix as static_prefix %}<span class="user-avatar {{ size_class|default:'' }}{% if user.selected_avatar %} {{ user.selected_avatar }}{% endif %}">{% if user.selected_avatar %}<img src="{{ static_prefix }}images/avatars/users/{{ user.selected_avatar }}.svg" alt="" loading="lazy" decoding="async">{% else %}<span aria-hidden="true">{% if user.first_name %}{{ user.first_name|first|upper }}{% else %}{{ user.username|first|upper }}{% endif %}</span>{% endif %}</span>
