<dialog
  class="rm-dialog"
  id="dd-read-more-dialog"
  aria-labelledby="dd-read-more-title"
>
  <div class="rm-dialog__card">
    <header class="rm-dialog__header">
      <div>
        <p>DERTDERMAN</p>

        <h2 id="dd-read-more-title" data-rm-title>Metnin tamamı</h2>
      </div>

      <button
        type="button"
        class="rm-dialog__close"
        data-rm-close
        aria-label="Pencereyi kapat"
      >
        ×
      </button>
    </header>

    <div class="rm-dialog__body" data-rm-body></div>

    <footer class="rm-dialog__footer">
      <button type="button" class="rm-dialog__done" data-rm-close>Kapat</button>
    </footer>
  </div>
</dialog>
