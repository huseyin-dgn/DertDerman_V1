{% extends 'layouts/public_base.html' %}

{% block title %}DertDerman | KVKK Aydınlatma Metni{% endblock %}

{% block body_class %}public-site corporate-page{% endblock %}

{% block extra_head %}
<style>
    .kvkk-page .corporate-heading {
        margin-bottom: 2rem;
    }

    .kvkk-page .corporate-story-grid {
        margin-bottom: 3rem;
    }

    .kvkk-page .corporate-principles {
        margin-top: 3rem;
        margin-bottom: 3rem;
    }

    .kvkk-page .corporate-heading + .corporate-heading {
        margin-top: 3rem;
    }

    .kvkk-page .corporate-closing {
        margin-top: 3.5rem;
    }

    .kvkk-page .corporate-heading p,
    .kvkk-page .corporate-story-grid p,
    .kvkk-page .corporate-principles dd,
    .kvkk-page .corporate-closing p {
        line-height: 1.75;
    }

    @media (max-width: 767px) {
        .kvkk-page .corporate-heading + .corporate-heading {
            margin-top: 2.25rem;
        }

        .kvkk-page .corporate-story-grid,
        .kvkk-page .corporate-principles {
            margin-bottom: 2.25rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<main id="main-content" class="kvkk-page">
    {% include 'core/legal/_disclosure_content.html' %}
