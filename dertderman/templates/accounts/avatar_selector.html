{% load static %}{% get_static_prefix as static_prefix %}<fieldset class="avatar-presets {{ selector_class|default:'' }}"><legend>{{ legend|default:'Hazır avatarlar' }}</legend>{{ field.errors }}<div>{% for choice in field %}<label class="avatar-preset-option">{{ choice.tag }}<span class="avatar-choice-preview user-avatar user-avatar--sm {{ choice.data.value }}"><img src="{{ static_prefix }}images/avatars/users/{{ choice.data.value }}.svg" alt="" loading="lazy" decoding="async"></span><small>{{ choice.choice_label }}</small><span class="avatar-choice-check" aria-hidden="true">✓</span></label>{% endfor %}</div></fieldset>
