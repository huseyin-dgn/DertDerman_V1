<form method="get" class="ad-filters" role="search" aria-label="Listeyi filtrele">{% for field in filter_form %}<div class="ad-filter-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<small class="ad-field-error" role="alert">{{ error }}</small>{% endfor %}</div>{% endfor %}<div class="ad-filter-actions"><button type="submit" class="primary-action">Uygula</button><a class="secondary-action" href="{{ request.path }}{% if request.resolver_match.url_name == 'complaint_list' %}?status={% endif %}">Temizle</a></div></form>
