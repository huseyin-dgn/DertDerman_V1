<!doctype html>
<html lang="tr">
  <body style="margin:0;padding:0;background:#f4f8fc;font-family:Arial,Helvetica,sans-serif;color:#172033;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f4f8fc;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:620px;background:#ffffff;border:1px solid #dfe8f3;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="background:#1d5fa7;padding:24px 32px;color:#ffffff;font-size:24px;font-weight:700;">DertDerman</td>
            </tr>
            <tr>
              <td style="padding:32px;line-height:1.65;font-size:16px;">
                {% block email_content %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="border-top:1px solid #e6edf5;padding:22px 32px;color:#667085;font-size:13px;line-height:1.7;">
                <strong style="color:#1d5fa7;">DertDerman</strong><br>
                {{ support_email }}<br>
                {{ support_phone }}<br>
                {{ support_hours }}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
